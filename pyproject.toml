[project]
name = "code-mem-graph"
version = "0.1.3"
description = "Source-backed repository knowledge, task context, and durable project memory for engineers and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Yam Malla", email = "amritmalla2021@gmail.com" },
]
keywords = [
    "claude",
    "claude-code",
    "mcp",
    "memory",
    "retrieval",
    "rag",
    "embeddings",
    "code-search",
    "llm",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "sqlite-vec>=0.1.3",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "markdown-it-py>=3.0",
    "tiktoken>=0.7",
    "click>=8.1",
    "pydantic>=2.6",
    "sentence-transformers>=2.7",
    "pyyaml>=6.0",
    "pathspec>=1.1.1",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
]
openai = ["openai>=1.0"]
voyage = ["voyageai>=0.2"]
anthropic = ["anthropic>=0.34"]

[project.urls]
Homepage = "https://github.com/amritmalla/code-mem-graph"
Repository = "https://github.com/amritmalla/code-mem-graph"
Issues = "https://github.com/amritmalla/code-mem-graph/issues"
Changelog = "https://github.com/amritmalla/code-mem-graph/blob/main/CHANGELOG.md"

[project.scripts]
code-mem-graph = "code_mem_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_mem_graph"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/code_mem_graph",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = [
    "tests",
    "docs",
    ".claude-repo-mem",
    "*.sqlite",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: tests that download models or are otherwise expensive"]
addopts = "-m 'not slow'"
