name: Model Download and Slow Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    name: Model-download and slow integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run slow and model-download tests
        run: python -m pytest -m slow -v
