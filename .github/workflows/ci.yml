name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.4"
      - name: Run linter
        run: python -m ruff check src/code_mem_graph scripts

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run default tests
        run: python -m pytest -q

  distribution:
    name: Distribution build and metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution contents and parity
        run: python -I scripts/check_distributions.py --dist dist --output build/receipts/packages.json
      - name: Strict twine check
        run: python -m twine check --strict dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  installed-package:
    name: Verify installed package (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist
      - name: Verify wheel installation in fresh environment
        shell: bash
        run: |
          uv venv --seed --python ${{ matrix.python-version }} .venv-wheel
          if [ "${{ runner.os }}" = "Windows" ]; then
            VENV_PYTHON=".venv-wheel/Scripts/python.exe"
          else
            VENV_PYTHON=".venv-wheel/bin/python"
          fi
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv pip install --python "$VENV_PYTHON" "$WHEEL"
          "$VENV_PYTHON" -m pip check
          "$VENV_PYTHON" -I scripts/verify_install.py --output build/receipts/wheel-${{ matrix.os }}-${{ matrix.python-version }}.json
      - name: Verify source distribution installation in fresh environment
        shell: bash
        run: |
          uv venv --seed --python ${{ matrix.python-version }} .venv-sdist
          if [ "${{ runner.os }}" = "Windows" ]; then
            VENV_PYTHON=".venv-sdist/Scripts/python.exe"
          else
            VENV_PYTHON=".venv-sdist/bin/python"
          fi
          SDIST=$(ls dist/*.tar.gz | head -n 1)
          uv pip install --python "$VENV_PYTHON" "$SDIST"
          "$VENV_PYTHON" -m pip check
          "$VENV_PYTHON" -I scripts/verify_install.py --output build/receipts/sdist-${{ matrix.os }}-${{ matrix.python-version }}.json
